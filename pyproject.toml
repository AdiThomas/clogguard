[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clogguard"
version = "0.1.0"
description = "Early detection and correction of developing nozzle clogs on a Klipper 3D printer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ENGG*41x0 Group 51" }]
# Runtime set: must install on a Raspberry Pi (arm64) without compilers.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
  "websockets>=12",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
train = ["lightgbm>=4.3", "matplotlib>=3.8"]
deep = ["torch>=2.2"]
tracking = ["mlflow>=2.12"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
design = ["openpyxl>=3.1"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.4",
  "httpx>=0.27",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "openpyxl>=3.1",
]

[project.scripts]
clogguard = "clogguard.cli:main"

[tool.setuptools.packages.find]
include = ["clogguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: long-running test (end-to-end replays)",
  "network: needs internet; skipped by default",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
source = ["clogguard"]
branch = true
