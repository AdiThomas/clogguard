# Channel set for logging the MOCK Moonraker server (clogguard mock-printer). All values are
# simulated. Sensors without a Klipper object come from the virtual object `clogguard_sim`.
version: 1
channels:
  - {name: extruder_temp_c, unit: degC, rate_hz: 10, source: moonraker, role: context,
     params: {object: extruder, field: temperature}}
  - {name: extruder_target_c, unit: degC, rate_hz: 10, source: moonraker, role: context,
     params: {object: extruder, field: target}}
  - {name: e_velocity_mm_s, unit: mm/s, rate_hz: 10, source: moonraker, role: context,
     params: {object: motion_report, field: live_extruder_velocity}}
  - {name: toolhead_velocity_mm_s, unit: mm/s, rate_hz: 10, source: moonraker, role: context,
     params: {object: motion_report, field: live_velocity}}
  - {name: speed_factor, unit: ratio, rate_hz: 10, source: moonraker, role: context,
     params: {object: gcode_move, field: speed_factor}}
  - {name: extrude_factor, unit: ratio, rate_hz: 10, source: moonraker, role: context,
     params: {object: gcode_move, field: extrude_factor}}
  - {name: fan_speed, unit: ratio, rate_hz: 10, source: moonraker, role: context,
     params: {object: fan, field: speed}}
  - {name: z_mm, unit: mm, rate_hz: 10, source: moonraker, role: context,
     params: {object: toolhead, field: position, index: 2}}
  - {name: volumetric_flow_mm3_s, unit: mm3/s, rate_hz: 10, source: derived, role: context,
     params: {fn: volumetric_flow, inputs: [e_velocity_mm_s]}}
  - {name: extruder_power, unit: ratio, rate_hz: 10, source: moonraker, role: signal,
     params: {object: extruder, field: power}}
  - {name: tmc_sg_result, unit: counts, rate_hz: 1, source: moonraker, role: signal,
     params: {object: "tmc2209 extruder", field: drv_status, key: sg_result}}
  - {name: force_g, unit: g, rate_hz: 10, source: moonraker, role: signal,
     params: {object: clogguard_sim, field: force_g}}
  - {name: accel_rms, unit: m/s2, rate_hz: 10, source: moonraker, role: signal,
     params: {object: clogguard_sim, field: accel_rms}}
  - {name: encoder_slip_mm, unit: mm, rate_hz: 10, source: moonraker, role: signal,
     params: {object: clogguard_sim, field: encoder_slip_mm}}
